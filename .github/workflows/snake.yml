name: generate snake

on:
  push:
    branches: [main]
  schedule:
    - cron: '17 20 * * *' # UTC 20:17 = 北京时间 04:17，每天凌晨更新
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: generate snake svgs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#FF8FBD&color_dots=#ebedf0,#9be9a8,#40c463,#30a14e,#216e39
            dist/github-snake-dark.svg?color_snake=#FF8FBD&color_dots=#161b22,#033a16,#196c2e,#2ea043,#56d364

      - name: flatten svg (static dots, no progress bar)
        shell: bash
        run: |
          for f in dist/*.svg; do
            # 格子常亮：去掉"被吃掉变空"的动画绑定
            sed -i -E 's/;animation-name:c[0-9a-z]+//g' "$f"
            # 删掉底部进度条
            sed -i -E 's/<rect class="u [^>]*>//g' "$f"
          done

      - name: push to output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
